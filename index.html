<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
  <style>
    :root {
      --theme-color: #222;
      --color-text: #222;
      --color-muted: #666;
      --color-line: #ddd;
      --color-bg: #fff;
      --color-hover: #57bf7d;
      --color-hover-nav: #73bc83;
      --font-body: "LXGW WenKai", "LXGW WenKai Lite", "Songti SC", serif;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body,
    .sidebar,
    .content,
    .markdown-section {
      color: var(--color-text);
      background: var(--color-bg);
      font-family: var(--font-body);
    }
    .app-nav,
    .app-nav a,
    .search,
    .search input {
      font-family: var(--font-ui);
    }
    .app-nav a,
    .sidebar a,
    .markdown-section a {
      color: #333;
    }
    .app-nav a:hover {
      color: var(--color-hover-nav);
    }
    .sidebar a:hover,
    .markdown-section a:hover {
      color: var(--color-hover);
    }
    .sidebar ul li.active > a {
      color: var(--color-hover);
    }
    .sidebar ul li.active > a {
      border-right-color: #222;
    }
    .cover,
    .cover .cover-main {
      background: #f5f5f5 !important;
      color: #222;
      font-family: var(--font-body);
    }
    .cover .cover-main > p a {
      color: #222;
      border-color: #222;
      background: transparent;
      font-family: var(--font-ui);
    }
    .cover .cover-main > p a:hover {
      color: #fff;
      background: #222;
      border-color: #222;
    }
    .cover .cover-main > p a:last-child {
      color: #fff;
      background: #222;
      border-color: #222;
    }
    .cover .cover-main > p a:last-child:hover {
      color: #fff;
      background: #000;
      border-color: #000;
    }
    .search input {
      border-color: #ccc;
      background: #fff;
      color: #222;
    }
    .search .matching-post {
      border-bottom-color: var(--color-line);
    }
    .markdown-section h1,
    .markdown-section h2 {
      font-weight: 600;
      border-bottom-color: var(--color-line);
      transition: color 0.15s ease;
    }
    .markdown-section h2:hover {
      color: var(--color-hover);
      cursor: default;
    }
    .markdown-section ul {
      list-style: none;
      padding-left: 0;
    }
    .markdown-section li.post-line {
      margin: 0;
      padding: 1.25rem 0;
      border-bottom: 1px solid var(--color-line);
    }
    .markdown-section li.post-line > a.post-title {
      display: inline-block;
      font-size: 1.35rem;
      line-height: 1.4;
      color: #000;
      text-decoration: none;
      font-weight: 600;
    }
    .markdown-section li.post-line > a.post-title:hover {
      color: var(--color-hover);
      text-decoration: none;
    }
    .markdown-section .post-summary {
      margin-top: 0.85rem;
      margin-bottom: 0;
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--color-muted);
      pointer-events: none;
      cursor: default;
    }
    .giscus-wrap {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--color-line);
      font-family: var(--font-ui);
    }
    .giscus-wrap__title {
      margin: 0 0 1.25rem;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      coverpage: true,
      onlyCover: true,
      loadNavbar: true,
      themeColor: '#222',
      giscus: {
        repo: 'hepuyao/hepuyao.github.io',
        repoId: 'MDEwOlJlcG9zaXRvcnkxNzU5NzYwMzk=',
        category: 'Announcements',
        categoryId: 'DIC_kwDOCn0uZ84DESkR',
        mapping: 'specific',
        theme: 'noborder_light',
        lang: 'zh-CN',
        reactionsEnabled: true,
        inputPosition: 'bottom',
        excludePaths: ['/', '/guide', '/guide.md', '/_coverpage', '/_navbar', '/_sidebar']
      },
      search: {
        maxAge: 86400000,
        paths: [],
        placeholder: {
          '/zh-cn/': '来这里 搜搜搜',
          '/': 'Type to search'
        },
        noData: {
          '/zh-cn/': '搜不到结果',
          '/': 'No Results'
        },
        depth: 2,
        hideOtherSidebarContent: false,
        namespace: 'website-1',
        pathNamespaces: /^(\/(zh-cn|ru-ru))?(\/(v1|v2))?/
      },
      plugins: [
        function (hook, vm) {
          var excerptCache = Object.create(null);
          var EXCERPT_LEN = 80;

          function resolveMarkdownPath(href) {
            if (!href || href.indexOf('http') === 0 || href.indexOf('mailto:') === 0) {
              return null;
            }
            var path = href;
            var hashIndex = path.indexOf('#');
            if (hashIndex >= 0) {
              path = path.slice(hashIndex + 1);
            }
            path = path.replace(/^\//, '');
            if (!path || path === '/' || path.indexOf('?') === 0) {
              return null;
            }
            path = path.split('?')[0];
            if (!path) {
              return null;
            }
            if (!/\.md$/i.test(path)) {
              path = path + '.md';
            }
            return decodeURIComponent(path);
          }

          function extractExcerpt(markdown) {
            var text = String(markdown || '')
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
              .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
              .replace(/^#{1,6}\s+/gm, '')
              .replace(/[*_`>~]/g, ' ')
              .replace(/\|/g, ' ')
              .replace(/^\s*[-+]\s+/gm, '')
              .replace(/\s+/g, ' ')
              .trim();
            if (!text) {
              return '';
            }
            if (text.length <= EXCERPT_LEN) {
              return text;
            }
            return text.slice(0, EXCERPT_LEN).replace(/\s+\S*$/, '') + ' ...';
          }

          function encodeMarkdownUrl(mdPath) {
            return mdPath.split('/').map(function (part) {
              return encodeURIComponent(part);
            }).join('/');
          }

          function loadExcerpt(mdPath) {
            if (excerptCache[mdPath]) {
              return excerptCache[mdPath];
            }
            excerptCache[mdPath] = fetch(encodeMarkdownUrl(mdPath))
              .then(function (res) {
                if (!res.ok) {
                  throw new Error('fetch failed');
                }
                return res.text();
              })
              .then(extractExcerpt)
              .catch(function () {
                return '';
              });
            return excerptCache[mdPath];
          }

          hook.doneEach(function () {
            var section = document.querySelector('.markdown-section');
            if (!section) {
              return;
            }
            var routeAtStart = (vm.route && vm.route.path) || '';
            var items = section.querySelectorAll('li');
            Array.prototype.forEach.call(items, function (li) {
              if (li.querySelector('.post-summary')) {
                return;
              }
              var link = li.querySelector(':scope > a[href], a[href]');
              if (!link) {
                return;
              }
              var href = link.getAttribute('href') || '';
              var mdPath = resolveMarkdownPath(href);
              if (!mdPath) {
                return;
              }
              if (li.parentElement && li.parentElement.closest && li.parentElement.closest('.app-nav')) {
                return;
              }
              li.classList.add('post-line');
              link.classList.add('post-title');
              loadExcerpt(mdPath).then(function (excerpt) {
                if (!excerpt) {
                  return;
                }
                if (((vm.route && vm.route.path) || '') !== routeAtStart) {
                  return;
                }
                if (li.querySelector('.post-summary')) {
                  return;
                }
                var summary = document.createElement('div');
                summary.className = 'post-summary';
                summary.textContent = excerpt;
                if (link.nextSibling) {
                  li.insertBefore(summary, link.nextSibling);
                } else {
                  li.appendChild(summary);
                }
              });
            });
          });
        },
        function (hook, vm) {
          var cfg = window.$docsify.giscus || {};
          var excludePaths = cfg.excludePaths || [];

          function shouldShowComments(path) {
            if (!cfg.repoId || cfg.repoId === 'YOUR_REPO_ID') {
              return false;
            }
            if (!path || path === '/') {
              return false;
            }
            var normalized = path.replace(/^\//, '').replace(/\.md$/i, '');
            return excludePaths.indexOf(path) === -1 &&
              excludePaths.indexOf('/' + normalized) === -1 &&
              excludePaths.indexOf('/' + normalized + '.md') === -1;
          }

          function removeGiscusFrame() {
            document.querySelectorAll('iframe.giscus-frame, script[src*="giscus.app"]').forEach(function (el) {
              el.remove();
            });
          }

          function mountGiscus(term) {
            var section = document.querySelector('.markdown-section');
            if (!section) {
              return;
            }
            var wrap = section.querySelector('.giscus-wrap');
            if (!wrap) {
              wrap = document.createElement('div');
              wrap.className = 'giscus-wrap';
              wrap.innerHTML = '<h3 class="giscus-wrap__title">评论</h3><div class="giscus"></div>';
              section.appendChild(wrap);
            }
            var host = wrap.querySelector('.giscus');
            if (!host) {
              return;
            }
            host.innerHTML = '';
            removeGiscusFrame();
            var script = document.createElement('script');
            script.src = 'https://giscus.app/client.js';
            script.setAttribute('data-repo', cfg.repo);
            script.setAttribute('data-repo-id', cfg.repoId);
            script.setAttribute('data-category', cfg.category);
            script.setAttribute('data-category-id', cfg.categoryId);
            script.setAttribute('data-mapping', cfg.mapping || 'specific');
            script.setAttribute('data-term', term);
            script.setAttribute('data-strict', '0');
            script.setAttribute('data-reactions-enabled', cfg.reactionsEnabled ? '1' : '0');
            script.setAttribute('data-emit-metadata', '0');
            script.setAttribute('data-input-position', cfg.inputPosition || 'bottom');
            script.setAttribute('data-theme', cfg.theme || 'noborder_light');
            script.setAttribute('data-lang', cfg.lang || 'zh-CN');
            script.crossOrigin = 'anonymous';
            script.async = true;
            host.appendChild(script);
          }

          hook.doneEach(function () {
            var path = (vm.route && vm.route.path) || '';
            var wrap = document.querySelector('.giscus-wrap');
            if (!shouldShowComments(path)) {
              if (wrap) {
                wrap.remove();
              }
              removeGiscusFrame();
              return;
            }
            var term = path.replace(/^\//, '');
            mountGiscus(term);
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
