<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>·</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="sync-bar">
      <span id="syncBadge" class="badge offline">本地：未连接</span>
      <button type="button" id="btnConnect" class="btn secondary small">重试连接</button>
    </div>

    <div id="backendHint" class="backend-hint">
      <p><strong>本地未连接</strong></p>
      <div class="download-box">
        <a class="download-btn" href="note_backend.py" download="note_backend.py">下载 note_backend.py</a>
        <a class="download-btn secondary-link" href="requirements.txt" download="requirements.txt">下载 requirements.txt</a>
      </div>
      <ol class="setup-steps">
        <li>安装依赖：<code>pip3 install -r requirements.txt</code></li>
        <li>启动助手：<code>python3 note_backend.py</code></li>
        <li>回到本页点「重试连接」；若浏览器询问访问本地网络，请允许</li>
      </ol>
      <div class="hint-actions">
        <button type="button" id="btnCopyStart" class="btn secondary small">复制启动命令</button>
      </div>
    </div>

    <div id="notebook" class="notebook is-away" tabindex="-1">
      <div class="nb-titlebar">
        <div class="nb-actions">
          <button type="button" id="btnSettings" class="btn ghost" title="settings">·</button>
          <button type="button" id="btnClear" class="btn ghost" title="clear">×</button>
          <button type="button" id="btnReveal" class="btn ghost" title="hold">◉</button>
        </div>
      </div>
      <textarea
        id="editor"
        class="nb-editor"
        placeholder=""
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <div class="nb-status">
        <span id="statusText" aria-hidden="true"></span>
        <span id="charCount" aria-hidden="true"></span>
      </div>
    </div>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm" class="settings-form">
      <h2>·</h2>
      <label>
        hover
        <input type="range" id="hoverOpacity" min="0.4" max="1" step="0.05">
        <span id="hoverOpacityVal"></span>
      </label>
      <label>
        blur
        <input type="range" id="leaveBlur" min="0" max="20" step="1">
        <span id="leaveBlurVal"></span>
      </label>
      <label>
        fade
        <input type="range" id="leaveOpacity" min="0.15" max="0.85" step="0.05">
        <span id="leaveOpacityVal"></span>
      </label>
      <label class="check">
        <input type="checkbox" id="hideAwayText" checked>
        mask
      </label>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn ghost">×</button>
        <button type="submit" value="ok" class="btn primary">ok</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
